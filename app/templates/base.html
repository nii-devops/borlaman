<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>
    {% if title %}
      {{ title }} – BorlaMan
    {% else %}
      BorlaMan
    {% endif %}
  </title>

  <!-- Bootstrap (we’re only using the grid and utilities here) -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
    crossorigin="anonymous"
  >
  <!-- Your custom theme -->
  <link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}"
  >
  {% block styles %}
  {% endblock styles %}
</head>

<body class="d-flex flex-column min-vh-100">

{% include 'navbar.html' %}

  <!-- ========== MAIN ========== -->
  <main class="container-fluid">
    {% include '_flashes.html' %}
    {% block content %}
    
    
    
    
    
    {% endblock %}
  </main>

  {% include 'footer.html' %}

  <!-- Bootstrap JS Bundle (no jQuery needed) -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
    crossorigin="anonymous"
  ></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Wait 3 seconds then close any flash alerts
      setTimeout(function() {
        // Select all Bootstrap alerts
        var alerts = document.querySelectorAll('.alert');
        alerts.forEach(function(el) {
          // Use Bootstrap’s Alert API to close
          var bsAlert = new bootstrap.Alert(el);
          bsAlert.close();
        });
      }, 3000);
    });
  </script>
  {% block scripts %}
  {% endblock %}
</body>
</html>
